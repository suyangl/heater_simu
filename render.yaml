services:
  - type: web
    name: heatsimu-static
    runtime: static
    # Static sites are free and have no compute plan.
    rootDir: frontend
    buildCommand: npm ci && npm run build:static
    staticPublishPath: dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /surrogate/*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /
        name: Cache-Control
        value: no-cache
